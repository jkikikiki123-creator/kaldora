:root{
  --bg:#1b1324;--panel:#2e2238;--panel2:#3a2c46;--deep:#140e1b;--o:#0f0a14;
  --ink:#f6ead2;--muted:#b4a2c0;--faint:#7a6886;
  --gold:#f2c14e;--gold-d:#b0782a;--gold-l:#ffe39a;
  --red:#d0402f;--red-d:#8a2218;--red-l:#f07a5a;--neg:#ff7a6a;--up:#8fe07a;
  --f:'Tiny5','Courier New',monospace;--fh:'PS2P','Tiny5',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:18px;font-synthesis:none;line-height:1.3;min-height:100vh;-webkit-font-smoothing:none;
  background-color:var(--bg);background-size:24px 24px;image-rendering:pixelated}
canvas,img.pi{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#app{position:relative;max-width:560px;margin:0 auto;padding:12px 14px 40px;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--ink)}
b{font-weight:700}
img.pi{flex:none}

/* pixel frame: notched corners via 4 offset shadows */
.pf{position:relative;background:var(--panel);margin:3px;
  box-shadow:inset 0 3px 0 0 rgba(255,255,255,.07),inset 0 -3px 0 0 rgba(0,0,0,.28),
    0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o),0 7px 0 0 rgba(0,0,0,.35)}
.pf.gold-edge{box-shadow:inset 0 3px 0 0 rgba(255,255,255,.07),inset 0 -3px 0 0 rgba(0,0,0,.28),
    0 -3px 0 0 var(--gold-d),0 3px 0 0 var(--gold-d),-3px 0 0 0 var(--gold-d),3px 0 0 0 var(--gold-d),0 7px 0 0 rgba(0,0,0,.4)}

/* pixel buttons */
.pb{--c:var(--gold);--cd:var(--gold-d);--cl:var(--gold-l);--tc:#2a1808;
  display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 6px);margin:3px;padding:13px 14px 15px;
  background:var(--c);color:var(--tc);font-family:var(--fh);font-size:13px;line-height:1.3;text-transform:uppercase;
  box-shadow:inset 0 -4px 0 0 var(--cd),inset 0 3px 0 0 var(--cl),0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o),0 7px 0 0 rgba(0,0,0,.4)}
.pb:active{transform:translateY(3px);box-shadow:inset 0 4px 0 0 var(--cd),0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o)}
.pb.red{--c:var(--red);--cd:var(--red-d);--cl:var(--red-l);--tc:#fff1e6}
.pb.dark{--c:var(--panel2);--cd:#241a2e;--cl:#4c3b5c;--tc:var(--gold-l)}
.pb.small{padding:8px 12px 10px;font-size:11px;width:auto}
.pb.danger{--tc:var(--neg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.two .pb{width:auto}

.title-bar{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.title-bar h1{flex:1;margin:0;font-family:var(--fh);font-size:22px;line-height:1;color:var(--gold);letter-spacing:.06em;text-shadow:3px 3px 0 var(--o),0 3px 0 var(--o)}
.title-bar .sub{display:block;font-family:var(--f);font-size:16px;color:var(--muted);letter-spacing:.12em;text-shadow:2px 2px 0 var(--o);margin-top:4px}
.sq{width:46px;height:46px;flex:none;padding:0}
.sq img{margin:auto}

.section{display:flex;align-items:center;gap:10px;margin:24px 0 12px;color:var(--gold);font-size:17px;letter-spacing:.14em;text-transform:uppercase;text-shadow:2px 2px 0 var(--o)}

/* roster list */
.roster{display:grid;gap:12px}

  box-shadow:inset 0 -3px 0 var(--gold-d),inset 0 2px 0 var(--gold-l),0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}

.foot{text-align:center;color:var(--faint);font-size:14px;margin-top:24px}

/* character */
.banner{position:relative;margin:-12px -14px 0}
.banner .back{position:absolute;top:10px;left:10px;z-index:3}

.hero-name h2{margin:0;font-family:var(--fh);font-size:20px;line-height:1.3;line-height:1;color:var(--ink);text-shadow:3px 3px 0 var(--o)}

.board{padding:22px 14px 16px;margin-top:26px}
.tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a1808;font-family:var(--fh);font-size:10px;line-height:1.6;padding:2px 10px 4px;white-space:nowrap;
  box-shadow:inset 0 -2px 0 var(--gold-d),0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}
.board-top{display:flex;align-items:center;gap:16px}

  clip-path:polygon(0 0,100% 0,100% 70%,85% 70%,85% 82%,70% 82%,70% 92%,55% 92%,55% 100%,45% 100%,45% 92%,30% 92%,30% 82%,15% 82%,15% 70%,0 70%);

.lab{font-size:14px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.xp-total{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-size:24px;margin:6px 0 4px;line-height:1.05;color:var(--gold);text-shadow:3px 3px 0 var(--o)}
.prof{font-size:16px;color:var(--muted);margin-top:4px}
.prof b{color:var(--ink)}
.bar-legend{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:8px}
.to-next{text-align:center;margin:12px 0 14px;font-size:18px}

.log-head{font-size:14px;letter-spacing:.14em;color:var(--gold);text-align:center;margin:20px 0 6px;text-transform:uppercase}
.log{list-style:none;margin:0;padding:0}

.x{flex:none;width:34px;height:34px;display:grid;place-items:center}
[data-confirm].armed{width:auto;padding:4px 10px 6px;background:var(--red);color:#fff1e6;font-size:14px;white-space:nowrap;box-shadow:inset 0 -3px 0 var(--red-d)}
.link{display:block;margin:10px auto 0;color:var(--gold);font-size:16px;text-decoration:underline;text-underline-offset:4px}
.list-box{padding:4px 12px}

.menu{display:grid;gap:12px}
.row-btn{display:flex;align-items:center;gap:14px;width:calc(100% - 6px);padding:12px;text-align:left}
.row-btn .ic{flex:none;width:52px;height:52px;display:grid;place-items:center;background:var(--deep);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),0 0 0 2px var(--o)}

.back{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 8px 8px;background:var(--panel2);color:var(--gold-l);font-size:16px;
  box-shadow:inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}
.top-row{margin:4px 0 8px}

.coin-board{text-align:center;padding:24px 14px 20px}
.coin-board img{margin:0 auto;animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

.eat{margin-top:16px}

.gold-total{font-family:var(--fh);font-size:32px;color:var(--gold);margin-top:14px;line-height:1;text-shadow:4px 4px 0 var(--o)}
.center{text-align:center}
.field{display:block;width:calc(100% - 6px);margin:3px;background:var(--deep);border:0;padding:12px 14px;font-size:19px;outline:none;color:var(--ink);border-radius:0;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.45),0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o)}
.field:focus{box-shadow:inset 0 3px 0 rgba(0,0,0,.45),0 -3px 0 0 var(--gold),0 3px 0 0 var(--gold),-3px 0 0 0 var(--gold),3px 0 0 0 var(--gold)}
.field::placeholder{color:var(--faint)}
.field.big{font-family:var(--fh);font-size:22px;text-align:center;color:var(--gold)}
.field + .field,.chips + .field{margin-top:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 3px 6px;scrollbar-width:none;margin-top:6px}
.chips::-webkit-scrollbar{display:none}

.chip{flex:none;white-space:nowrap;padding:5px 10px 7px;font-size:15px;color:var(--muted);background:var(--panel2);
  box-shadow:inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o);margin:2px}
.chip.on{background:var(--rc,var(--gold));color:#1b1208;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.35),0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}

/* honor */
.gods{display:grid;gap:14px}

  box-shadow:inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}

  box-shadow:inset 4px 0 0 var(--c),inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o);margin:2px}

.inline{display:flex;gap:8px;margin-top:6px;align-items:stretch}
.inline .field{flex:1}
.inline .pb{width:auto;margin:3px}

/* items */
.rar-sum{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:16px 0 4px;font-size:15px;color:var(--muted)}

.item{display:flex;align-items:center;gap:12px;width:calc(100% - 6px);padding:10px;text-align:left}

/* parchment */
.statblock{position:relative;margin:6px 3px 10px;padding:16px 16px 18px;color:#2a1d12;background:#ecdcb4;
  box-shadow:inset 0 4px 0 #f8ecd0,inset 0 -4px 0 #c9b083,inset 4px 0 0 #f3e5c2,inset -4px 0 0 #d6c093,
    0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o),0 8px 0 0 rgba(0,0,0,.4)}

.sb-desc{font-size:17px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,6,14,.72);animation:fade .15s steps(3)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;max-height:calc(var(--tg-viewport-height,100vh)*.9);overflow:auto;overscroll-behavior:contain;
  background:var(--panel);padding:14px 16px calc(22px + env(safe-area-inset-bottom));
  box-shadow:inset 0 4px 0 var(--panel2),0 -4px 0 0 var(--o),0 -8px 0 0 var(--gold-d);animation:up .22s steps(6)}

.sheet-who{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:16px;margin-bottom:4px}
.sheet label,.flabel{display:block;font-size:14px;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px;text-transform:uppercase}

  box-shadow:inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o);margin:2px}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:calc(100% - 6px);margin:16px 3px 0;padding:10px 12px 12px;background:var(--panel2);

.toggle.on .sw::after{left:25px;background:var(--gold)}

.pm .field{flex:1}

/* level up */
.lvlup{position:fixed;inset:0;z-index:80;display:grid;place-items:center;overflow:hidden;text-align:center;padding:20px;background:#140e1b;animation:fade .3s steps(4)}

  background:repeating-conic-gradient(rgba(242,193,78,.16) 0 10deg,transparent 10deg 20deg);animation:spin 8s steps(16) infinite}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}


/* readable text (dnd.su-like) */
.rd{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;-webkit-font-smoothing:antialiased;font-synthesis:weight style;letter-spacing:0}

/* patches */
.patches{display:grid;gap:12px;margin-top:16px}
.patch{display:block;width:calc(100% - 6px);padding:12px 14px 14px;text-align:left}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}

.pdate{font-size:14px;color:var(--faint)}
.pt{font-size:17px;font-weight:700;line-height:1.3;color:var(--ink)}
.pd{font-size:14px;line-height:1.45;color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sb-title.rd{font-size:20px;font-weight:700;line-height:1.25;color:#8a2218;margin-top:10px}

/* hag duel */
.g-stage{position:relative;margin:0 -14px;overflow:hidden;background:#000}
.g-stage canvas{width:100%}
.g-stage.shake{animation:shk .32s steps(6)}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.hud{position:absolute;left:10px;right:10px;top:10px;display:grid;grid-template-columns:1fr 1fr;gap:12px;z-index:2}
.hp{background:rgba(20,14,27,.85);padding:6px 8px 7px;box-shadow:0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}
.hp .hn{display:flex;justify-content:space-between;font-family:var(--fh);font-size:9px;color:var(--gold-l)}
.hp .bar{margin:6px 2px 2px;height:10px}
.hp .bar i{transition:width .5s steps(6)}
.youbar i{background:#6cc35a;box-shadow:inset 0 2px 0 #a8f090,inset 0 -2px 0 #2f7a3a}
.hagbar i{background:#b36bff;box-shadow:inset 0 2px 0 #e0b4ff,inset 0 -2px 0 #6a2bd6}
#gfx{position:absolute;inset:0;pointer-events:none;z-index:3}
.dmg{position:absolute;font-family:var(--fh);font-size:26px;text-shadow:3px 3px 0 var(--o);animation:dmgf 1.1s steps(9) forwards}
.dmg.onhag{color:var(--gold)}
.dmg.onyou{color:#ff5a4a}
@keyframes dmgf{0%{transform:translate(-50%,-20%) scale(.6);opacity:1}25%{transform:translate(-50%,-80%) scale(1.3)}100%{transform:translate(-50%,-170%) scale(1);opacity:0}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#b36bff;z-index:2}
.flash.on{animation:flsh .5s steps(5)}
@keyframes flsh{0%{opacity:.8}100%{opacity:0}}
.g-splash,.g-end{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(15,10,20,.74)}
.hide{display:none!important}
.g-splash h2{font-family:var(--fh);font-size:17px;line-height:1.6;color:var(--gold);text-shadow:3px 3px 0 var(--red-d),0 3px 0 var(--o);margin:16px 0 8px}
.g-splash img{animation:bob 1s steps(2) infinite}
.g-splash p,.g-end p{margin:0;font-size:18px}
.g-end h2{font-family:var(--fh);font-size:16px;line-height:1.7;margin:12px 0 10px}
.g-end.win h2{color:var(--gold);text-shadow:3px 3px 0 var(--o)}
.g-end.lose{background:rgba(70,8,8,.8)}
.g-end.lose h2{color:#ff7a6a;text-shadow:3px 3px 0 var(--o)}
.g-panel{padding:14px 12px 12px;margin-top:18px}
.g-turn{font-family:var(--fh);font-size:12px;text-align:center;color:var(--gold);min-height:16px;text-shadow:2px 2px 0 var(--o)}
.dice-row{display:flex;justify-content:center;gap:28px;margin:12px 0 2px}
.dice-row:empty{margin:0}
.die{position:relative;display:flex;flex-direction:column;align-items:center}
.die .dn{position:absolute;top:46px;left:50%;transform:translate(-50%,-50%);font-family:var(--fh);font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--o)}
.die small{font-size:16px;color:var(--muted);margin-top:4px}
.die.rolling img{animation:droll .16s steps(2) infinite}
@keyframes droll{50%{transform:rotate(12deg) translateY(-5px)}}
.die.landed .dn{animation:dpop .3s steps(3)}
@keyframes dpop{0%{transform:translate(-50%,-50%) scale(1.8)}100%{transform:translate(-50%,-50%) scale(1)}}
.die.best small{color:var(--gold)}
.g-log{text-align:center;color:var(--ink);font-size:18px;min-height:24px;margin:8px 0 4px}
#gbtn[disabled]{filter:grayscale(.7) brightness(.75)}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,30px);opacity:0;pointer-events:none;
  padding:9px 16px 11px;background:var(--panel2);color:var(--ink);font-size:16px;max-width:90vw;text-align:center;transition:all .2s steps(3);
  box-shadow:0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<script>
/* ===== Pixel sprite engine + Caldora heroes ===== */
const PX = (() => {
const W = 28, H = 33, FR = 8;
const OUT = '#120c16';

function SB(W, H){
  W = W || 28; H = H || 33;
  const g = Array.from({length:H}, () => Array(W).fill(null));
  let mir = false;
  const set = (x,y,k) => { if (x>=0 && x<W && y>=0 && y<H) g[y][x] = k; };
  const api = {
    g,
    mir(v){ mir = v; return api; },
    p(x,y,k){ set(x,y,k); if (mir) set(W-1-x,y,k); return api; },
    ps(k, pts){ pts.forEach(([x,y]) => api.p(x,y,k)); return api; },
    r(x,y,w,h,k){ for (let j=0;j<h;j++) for (let i=0;i<w;i++) api.p(x+i,y+j,k); return api; },
    hl(x1,x2,y,k){ for (let x=x1;x<=x2;x++) api.p(x,y,k); return api; },
    vl(x,y1,y2,k){ for (let y=y1;y<=y2;y++) api.p(x,y,k); return api; },
    c(x,y){ set(x,y,null); if (mir) set(W-1-x,y,null); return api; },
    // filled circle
    circ(cx,cy,rad,k){ for (let y=Math.floor(cy-rad);y<=Math.ceil(cy+rad);y++) for (let x=Math.floor(cx-rad);x<=Math.ceil(cx+rad);x++){ const dx=x-cx,dy=y-cy; if (dx*dx+dy*dy <= rad*rad+0.3) api.p(x,y,k); } return api; },
    ring(cx,cy,rad,k){ for (let y=Math.floor(cy-rad);y<=Math.ceil(cy+rad);y++) for (let x=Math.floor(cx-rad);x<=Math.ceil(cx+rad);x++){ const d=Math.sqrt((x-cx)**2+(y-cy)**2); if (d<=rad+0.5 && d>rad-0.7) api.p(x,y,k); } return api; },
  };
  return api;
}

// shared body bits
function face(s, o){
  s.mir(true);
  s.r(9,3,5,1,'s').r(8,4,6,9,'s').r(9,13,5,1,'s');
  s.vl(8,9,12,'S').hl(9,13,13,'S');
  if (o.ears === 'point'){ s.ps('s',[[7,8],[7,9],[6,7],[5,6]]).ps('S',[[7,9]]); }
  else if (o.ears !== false){ s.ps('s',[[7,8],[7,9]]).p(7,9,'S'); }
  s.p(11,8,'e').p(11,9,'e');
  if (o.shine) s.p(11,8,o.shine);
  s.mir(false);
  if (o.mouth !== false) s.hl(13,14,11,'m');
  s.mir(true).r(12,14,2,1,'S').mir(false);
}
function legs(s, pant, boot, opt){
  opt = opt || {};
  s.mir(true);
  s.r(10,24,3,5,pant);
  s.r(9,29,4,3,boot).hl(9,12,29,opt.cuff||boot);
  s.mir(false);
}

const HEROES = {};

/* ---------------- Ландер Хэрзир ---------------- */
HEROES.lander = {

    s:'#e2aa82', S:'#b97b5c', e:['#1b1420','#1b1420','#1b1420','#1b1420','#1b1420','#b97b5c','#1b1420','#1b1420'], m:'#8f5440',
    h:'#2a1d17', H:'#4e3829', b:'#a77558',
    c:'#4d5260', C:'#353843', k:'#6b7282', t:'#262a3a', T:'#353a50', g:'#e0ab45',
    l:'#6b4426', p:'#3b302b', B:'#241a15', o:'#2a1e1b', O:'#5a463c',
    r:['#c4561e','#e98a2e','#ffc35a','#e98a2e'], R:['#e98a2e','#ffc35a','#e98a2e','#c4561e']
  },
  draw(s){
    // cloak behind legs
    s.mir(true).r(7,22,4,6,'C').mir(false);
    legs(s,'p','B');
    face(s,{});
    // hair
    s.mir(true).r(9,1,5,1,'h').r(8,2,6,2,'h').r(7,3,2,4,'h').mir(false);
    s.hl(9,18,4,'h').ps('h',[[10,5],[11,5],[16,5],[17,5],[18,5],[18,6]]).ps('H',[[11,2],[12,2],[13,2],[10,3],[11,3]]);
    // stubble
    s.mir(true).r(9,11,5,2,'b').r(9,13,5,1,'S').p(9,10,'b').mir(false);
    s.hl(12,15,11,'m');
    // hood bunched + cloak
    s.mir(true).r(8,14,6,2,'c').hl(9,13,14,'k').r(7,16,3,8,'c').vl(9,16,23,'C').vl(7,16,23,'k').mir(false);
    s.r(10,16,8,8,'t').vl(13,16,23,'T');
    s.ps('g',[[14,17],[14,19],[14,21]]);
    s.hl(10,17,22,'l').p(14,22,'g');
    // right hand at side
    s.hl(19,20,23,'s').p(20,24,'S');
    // left hand holding orb
    s.hl(6,9,22,'s').p(9,21,'s');
    s.circ(6.5,19,2.6,'o');
    s.ps('O',[[5,17],[4,18]]);
    s.ps('r',[[6,18],[7,19],[5,20],[8,18]]).ps('R',[[6,20],[7,21],[4,19]]);
  }
};

/* ---------------- Ксир (дроу) ---------------- */
HEROES.ksir = {

    s:'#5d6272', S:'#434755', e:['#eef0ff','#eef0ff','#eef0ff','#eef0ff','#eef0ff','#434755','#eef0ff','#eef0ff'], m:'#2f313b',
    h:'#ecebf2', H:'#ffffff', d:'#b5b2c4',

    s.ps('h',[[9,5],[10,5],[13,5],[17,5],[18,5],[18,6],[9,6]]);
    s.ps('d',[[8,5],[19,5],[19,6]]);
    // ears over hair
    s.mir(true).ps('s',[[7,8],[6,7],[5,6]]).p(7,9,'S').mir(false);
    // scarf
    s.mir(true).r(8,14,6,3,'z').hl(9,13,14,'Z').mir(false);

    s.mir(true).r(9,17,5,7,'a').r(7,15,2,8,'a').r(7,15,3,2,'A').mir(false);
    s.vl(14,17,23,'A');
    s.ps('w',[[13,18],[15,18],[14,19],[12,20],[16,20],[14,21],[13,22],[15,22],[8,16],[19,16],[11,19],[17,19]]);
    s.hl(9,18,23,'Z');
    // hands + daggers pointing down

};

HEROES.ikki = {

    f:'#7d5c44', F:'#5a3f2e', k:'#9a9ca6', K:'#5d5f69',
    n:'#283058', N:'#1b2142', q:'#3a4478',
    x:['#fff6c4','#fff6c4','#7c86c8','#fff6c4','#fff6c4','#7c86c8','#fff6c4','#fff6c4'],
    y:['#7c86c8','#fff6c4','#fff6c4','#fff6c4','#7c86c8','#fff6c4','#fff6c4','#7c86c8'],

  draw(s){

    s.mir(true).r(9,15,5,10,'n').r(8,24,6,5,'n').r(7,27,7,2,'n').vl(13,15,28,'N').mir(false);

    // beak

    s.mir(true).r(6,15,3,6,'n').r(5,20,4,3,'n').hl(5,8,22,'N').mir(false);

    s.ps('u',[[13,16],[14,16],[14,17]]);

/* ---------------- Джон Смит (ландскнехт) ---------------- */
HEROES.john = {

    s:'#e8a47e', S:'#bf7656', e:['#1b1420','#1b1420','#1b1420','#1b1420','#1b1420','#bf7656','#1b1420','#1b1420'], m:'#7a3a2a',

/* ---------------- Эстебан Тистахия ---------------- */
HEROES.esteban = {
  pal:{
    s:'#c98a5e', S:'#9c6440', e:['#ffb000','#ffb000','#ffd36a','#ffb000','#ffb000','#9c6440','#ffb000','#ffb000'], m:'#6e3a24',

/* ---------------- Силакви (тифлинг-шут) ---------------- */

/* ---------------- Render ---------------- */
function render(hero){
  const W = hero.w || 28, H = hero.h || 33, BT = hero.bt || 23;
  const s = SB(W, H); hero.draw(s);
  const pal = hero.pal, OW = W+2, OH = H+2;
  const cv = document.createElement('canvas'); cv.width = OW*FR; cv.height = OH;
  const ctx = cv.getContext('2d');
  for (let f=0; f<FR; f++){
    const breathe = (f % 4) >= 2;
    const buf = Array.from({length:OH}, () => Array(OW).fill(null));
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      const k = s.g[y][x]; if (!k) continue;
      let col = pal[k]; if (Array.isArray(col)) col = col[f % col.length];
      if (col === undefined) col = '#ff00ff';
      if (!col) continue;
      const ty = (breathe && y <= BT) ? y+1 : y;
      if (ty < H) buf[ty+1][x+1] = col;
    }
    for (let y=0;y<OH;y++) for (let x=0;x<OW;x++){
      let col = buf[y][x];
      if (!col && ((y>0&&buf[y-1][x])||(y<OH-1&&buf[y+1][x])||(x>0&&buf[y][x-1])||(x<OW-1&&buf[y][x+1]))) col = OUT;
      if (col){ ctx.fillStyle = col; ctx.fillRect(f*OW + x, y, 1, 1); }
    }
  }
  return cv;
}

const dims = id => ({fw:(HEROES[id].w||28)+2, fh:(HEROES[id].h||33)+2});
return {W:W+2, H:H+2, FR, HEROES, sheet, dims};

const SCN = (() => {
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const F = (c,x,y,w,h,col) => { c.fillStyle = col; c.fillRect(x|0,y|0,w|0,h|0); };
const P = (c,x,y,col) => { c.fillStyle = col; c.fillRect(x|0,y|0,1,1); };
const hash = n => { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; };
const TH = 64, FLOOR = 7;

function woodFloor(c, W, fy, H, base, top, mid, joint){

  for (let row=0; row<2; row++) for (let x=(row?4:0); x<W; x+=9) F(c,x,fy+2+row*3,1,2,joint);

/* --- Rampart at sunset --- */
function rampart(c, W, H, R){
  const fy = H - FLOOR;
  const sky = ['#26183a','#33204a','#4a2654','#6b2e58','#913a54','#b84a4c','#d9673f','#ef8c45','#f6b25e'];
  const bh = fy / sky.length;
  for (let y=0; y<fy; y++){
    const i = Math.min(sky.length-1, Math.floor(y/bh)), fr = y/bh - i;
    F(c,0,y,W,1,sky[i]);
    if (i < sky.length-1){
      if (fr > 0.7) for (let x=(y%2); x<W; x+=2) P(c,x,y,sky[i+1]);
      else if (fr > 0.45) for (let x=(y%2)*2; x<W; x+=4) P(c,x,y,sky[i+1]);
    }
  }
  // sun
  const sx = Math.round(W*0.5), sy = fy-17;
  for (let y=-8;y<=8;y++) for (let x=-8;x<=8;x++){ const d = x*x+y*y; if (d<=64) P(c,sx+x,sy+y, d<=30 ? '#fff0b8' : '#ffd27a'); }
  // clouds
  for (let i=0;i<4;i++){
    const w = 8 + (R()*12|0), x = (R()*W|0) - 4, y = 4 + (R()*20|0);
    F(c,x+2,y,w-4,1,'#f4a88e'); F(c,x,y+1,w,1,'#e8907e'); F(c,x+1,y+2,w-2,1,'#c66a70');
  }
  // distant castle silhouettes
  const yb = fy - 8;
  let x = -2;
  while (x < W){
    const tw = 4 + (R()*5|0), th = 7 + (R()*15|0);
    F(c,x,yb-th,tw,th+8,'#3a2142');
    for (let i=0;i<tw;i+=2) P(c,x+i,yb-th-1,'#3a2142');
    if (R() < 0.45){ const cx = x + (tw>>1); for (let k=0;k<4;k++) F(c,cx-k+ (tw%2?0:0),yb-th-5+k,k*2+1,1,'#2e1a36'); }
    if (R() < 0.7) P(c,x+(tw>>1),yb-th+3,'#ffc85a');
    const gap = 2 + (R()*6|0);
    F(c,x+tw,yb-4,gap,12,'#3a2142');
    for (let i=0;i<gap;i+=2) P(c,x+tw+i,yb-5,'#3a2142');
    x += tw + gap;
  }
  // parapet
  const wy = fy - 8;
  F(c,0,wy,W,8,'#5d5270'); F(c,0,wy,W,1,'#7f7394');
  F(c,0,wy+3,W,1,'#463d56'); F(c,0,wy+6,W,1,'#463d56');
  for (let r=0;r<2;r++) for (let xx=(r?3:0); xx<W; xx+=7) F(c,xx,wy+1+r*3,1,2,'#463d56');
  for (let xx=1; xx<W; xx+=9){ F(c,xx,wy-4,5,4,'#5d5270'); F(c,xx,wy-4,5,1,'#8f83a4'); F(c,xx+4,wy-3,1,3,'#463d56'); }
  // floor slab
  F(c,0,fy,W,H-fy,'#3f354c'); F(c,0,fy,W,1,'#8f83a4'); F(c,0,fy+1,W,1,'#6d6182');
  F(c,0,fy+4,W,1,'#2a2234');
  for (let r=0;r<2;r++) for (let xx=(r?5:1); xx<W; xx+=10) F(c,xx,fy+2+r*3,1,2,'#2a2234');
  F(c,0,H-1,W,1,'#100a16');
  // banner pole
  const bx = Math.max(3, Math.round(W*0.05));
  F(c,bx,wy-28,1,28,'#4a2f1c'); P(c,bx,wy-29,'#f2c14e');
  return {flag:{x:bx+1, y:wy-27}, birds:[R()*W, R()*W]};
}
function rampartAnim(c, W, H, t, st){
  const {x, y} = st.flag, wave = t % 4 < 2;

function flame(c, x, y, t, seed, big){

function tavern(c, W, H, R){

function tavernAnim(c, W, H, t, st){

// tiers: [{kind, seed}] stacked vertically
function build(W, tiers){

function meadow(W, H){

    const x = R()*W|0; if (Math.abs(x-cx) < half+1) continue;

    if (R()<0.25) P(c,x+2,y-1,['#ffffff','#ffe066','#ff8ab0','#b8a0ff'][R()*4|0]);

const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } };
const lsSet = s => { try { localStorage.setItem(LS_KEY, s); } catch(e){} };
function save(){
  S.updatedAt = Date.now();
  const s = JSON.stringify(S);
  lsSet(s);
  if (CLOUD){ clearTimeout(cloudTimer); cloudTimer = setTimeout(() => cloudSave(s), 700); }
}
function cloudSave(s){
  const size = 3800, n = Math.max(1, Math.ceil(s.length/size));
  let pending = n, failed = false;
  for (let i=0;i<n;i++){
    CLOUD.setItem('d'+i, s.slice(i*size,(i+1)*size), err => {
      if (err) failed = true;
      if (--pending === 0){
        if (failed){ toast('Не удалось сохранить в облако Telegram'); return; }
        CLOUD.setItem('meta', JSON.stringify({n, u:S.updatedAt}), () => {});
        if (lastChunks > n){ const rm=[]; for (let j=n;j<lastChunks;j++) rm.push('d'+j); try{ CLOUD.removeItems(rm, () => {}); }catch(e){} }
        lastChunks = n;
      }
    });
  }
}
function cloudLoad(cb){
  CLOUD.getItem('meta', (err, m) => {
    if (err || !m) return cb(null);
    let meta; try { meta = JSON.parse(m); } catch(e){ return cb(null); }
    lastChunks = meta.n;
    const keys = Array.from({length:meta.n}, (_,i) => 'd'+i);
    CLOUD.getItems(keys, (err2, vals) => {
      if (err2 || !vals) return cb(null);
      try { cb(JSON.parse(keys.map(k => vals[k]||'').join(''))); } catch(e){ cb(null); }
    });
  });
}

let scenes = [], lastF = -1;
function drawSprites(f){
  document.querySelectorAll('canvas.spr').forEach(cv => {
    const c = cv.getContext('2d'), sh = PX.sheet(cv.dataset.hero);
    c.clearRect(0,0,cv.width,cv.height);
    if (cv.dataset.crop) c.drawImage(sh, f*PX.W + 5, 0, 20, 17, 0, 0, 20, 17);
    else c.drawImage(sh, f*PX.W, 0, PX.W, PX.H, 0, 0, PX.W, PX.H);
  });
}
function tick(force){
  if (document.hidden && !force) return;
  const now = performance.now(), f = Math.floor(now/260) % PX.FR, t = Math.floor(now/125);
  scenes.forEach(sc => {
    const c = sc.ctx; sc.sc.draw(c, t);
    sc.actors.forEach(a => c.drawImage(PX.sheet(a.id), f*PX.W, 0, PX.W, PX.H, a.x, a.y, PX.W, PX.H));
  });
  if (f !== lastF || force){ lastF = f; drawSprites(f); }
}

function initScenes(){
  scenes = [];
  document.querySelectorAll('.scene[data-tiers]').forEach(el => {
    const tiers = el.dataset.tiers.split(',').map(k => TIERS.find(t => t.kind === k));
    const solo = el.dataset.solo;
    const cw = el.clientWidth;
    const scale = solo ? Math.max(4, Math.min(6, Math.floor(cw/80))) : (cw < 440 ? 3 : 4);
    const W = Math.ceil(cw/scale);
    const sc = SCN.build(W, tiers.map(t => ({kind:t.kind, seed:t.seed})));
    const cv = el.querySelector('canvas'); cv.width = W; cv.height = sc.H; cv.style.height = (sc.H*scale) + 'px'; cv.style.width = (W*scale)+'px';
    const actors = [], layer = el.querySelector('.layer');
    let html = '';
    tiers.forEach((t, ti) => {
      const list = solo ? [{id:solo, pos:0.5}] : t.ids.map((id,k) => ({id, pos:t.pos[k]}));
      list.forEach(({id, pos}) => {
        const x = Math.round(W*pos - PX.W/2), y = ti*SCN.TH + SCN.TH - SCN.FLOOR - 33;
        actors.push({id, x, y});
        if (!solo){
          const p = prog(C(id).xp);
          html += `<div class="plate" style="left:${(x+PX.W/2)*scale}px;top:${(y+1)*scale - 4}px"><span class="lv">${p.l}</span>${esc(CH(id).short)}</div>`;

        }
      });
    });
    layer.innerHTML = html;
    scenes.push({ctx:cv.getContext('2d'), sc, actors});
  });
}

const lvlQueue = [];
function addXP(id, d, note){
  if (!d) return;
  const c = C(id), before = lvl(c.xp);
  const real = Math.max(0, c.xp + d) - c.xp;
  c.xp += real;
  c.xpLog.unshift({id:uid(), d:real, note:note||'', t:Date.now()});
  save();
  const after = lvl(c.xp);
  if (after > before) lvlQueue.push({id, from:before, to:after});
  else if (after < before) toast(`${CH(id).name}: уровень понижен до ${after}`);
}

const G = {phase:'intro', php:30, hhp:30, busy:false, log:''};
let GS = null;
const roll = n => 1 + Math.floor(Math.random()*n);
const lerp = (a,b,t) => a + (b-a)*t;
function gReset(){ Object.assign(G, {phase:'intro', php:30, hhp:30, busy:false, log:''}); }
function initGame(){
  const st = $('#gstage'); if (!st){ GS = null; return; }
  const cw = st.clientWidth, scale = cw < 440 ? 4 : 5, W = Math.ceil(cw/scale), H = 112;
  const cv = $('#gcv'); cv.width = W; cv.height = H; cv.style.width = (W*scale)+'px'; cv.style.height = (H*scale)+'px';
  const d = PX.dims('hag'), tmp = document.createElement('canvas'); tmp.width = d.fw; tmp.height = d.fh;
  GS = {W, H, cv, ctx:cv.getContext('2d'), bg:SCN.meadow(W,H), tmp, swing:null, cast:null, hitUntil:0, trail:[],
    deadAt: G.phase==='end' && G.hhp<=0 ? 1 : 0, lostAt: G.phase==='end' && G.php<=0 ? 1 : 0};
  const me = GS;
  const loop = () => { if (GS !== me || !cv.isConnected) return; gDraw(performance.now()); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  gUI();
  if (G.phase === 'end') gEndOverlay();
}
function disc(c, cx, cy, r, col){ c.fillStyle = col; const R = Math.ceil(r); for (let y=-R;y<=R;y++) for (let x=-R;x<=R;x++) if (x*x+y*y <= r*r) c.fillRect(Math.round(cx+x), Math.round(cy+y), 1, 1); }
function drawSword(c, x, y, a, L){
  const dx = Math.cos(a), dy = Math.sin(a), px = -dy, py = dx;
  const dot = (t, s, r, col) => { const X = Math.round(x+dx*t+px*s), Y = Math.round(y+dy*t+py*s); c.fillStyle = col; c.fillRect(X-r, Y-r, r*2+1, r*2+1); };
  for (let t=-12; t<=L; t++) dot(t, 0, t > L-4 ? 1 : 2, '#1a1222');
  for (let s=-8; s<=8; s++) dot(2, s, 2, '#1a1222');
  dot(-13, 0, 2, '#1a1222');
  for (let t=-12; t<0; t++) dot(t, 0, 1, (t%3===0) ? '#3a2416' : '#6a4426');
  dot(-13, 0, 1, '#d8a840');
  for (let s=-7; s<=7; s++) dot(2, s, 1, '#c8963a');
  dot(2,-7,1,'#e8c060'); dot(2,7,1,'#e8c060'); dot(2,0,1,'#8a2a2a');
  for (let t=4; t<=L; t++) dot(t, 0, t > L-3 ? 0 : 1, '#a6aebe');
  for (let t=4; t<=L-3; t++) dot(t, -1, 0, '#eef2f8');
  dot(L, 0, 0, '#ffffff');
  return {x: x+dx*L, y: y+dy*L};
}
function gDraw(now){
  const c = GS.ctx, W = GS.W, H = GS.H;
  c.globalAlpha = 1; c.drawImage(GS.bg, 0, 0);
  const {fw, fh} = PX.dims('hag'), f = Math.floor(now/260) % PX.FR, sh = PX.sheet('hag');
  let hx = Math.round(W/2 - fw/2), hy = H - 22 - fh;
  if (now < GS.hitUntil) hx += (Math.floor(now/50) % 2 ? 2 : -2);
  c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(hx+8, H-23, fw-16, 2);
  c.save();
  if (GS.deadAt){ const k = Math.min(1, (now-GS.deadAt)/900); c.globalAlpha = 1 - k*0.85; hy += Math.round(k*12); }
  if (now < GS.hitUntil){
    const t = GS.tmp.getContext('2d'); t.globalCompositeOperation = 'source-over'; t.clearRect(0,0,fw,fh);
    t.drawImage(sh, f*fw, 0, fw, fh, 0, 0, fw, fh); t.globalCompositeOperation = 'source-atop';
    t.fillStyle = 'rgba(255,255,255,.8)'; t.fillRect(0,0,fw,fh); c.drawImage(GS.tmp, hx, hy);
  } else c.drawImage(sh, f*fw, 0, fw, fh, hx, hy, fw, fh);
  c.restore();
  // hag spell
  const handX = hx + 35.5, handY = hy + 22;
  if (GS.cast){
    const p = (now - GS.cast.start) / GS.cast.dur;
    if (p < 0.35){ const r = 3 + p*14; disc(c, handX, handY, r, 'rgba(179,107,255,.35)'); disc(c, handX, handY, r*0.5, '#e0b4ff'); }
    else {
      const q = Math.min(1, (p-0.35)/0.65), x = lerp(handX, W/2, q), y = lerp(handY, H*0.8, q*q), r = 2 + q*15;
      for (let i=1;i<5;i++){ const qq = Math.max(0, q - i*0.06); disc(c, lerp(handX, W/2, qq), lerp(handY, H*0.8, qq*qq), Math.max(1,(2+qq*15)*0.35), 'rgba(179,107,255,.5)'); }
      disc(c, x, y, r, '#6a2bd6'); disc(c, x, y, r*0.72, '#b36bff'); disc(c, x, y, r*0.38, '#f0d8ff');
      if (q >= 1 && !GS.cast.done){ GS.cast.done = true; const cb = GS.cast.cb; GS.cast = null; cb(); }
    }
  }
  // sword (first person)
  let ang = -1.72, ox = 0, oy = Math.floor(now/450) % 2, slashing = false;
  if (GS.swing){
    const p = (now - GS.swing.start) / GS.swing.dur;
    if (p >= 1){ GS.swing = null; GS.trail = []; }
    else {
      if (p < 0.25) ang = lerp(-1.72, -2.6, p/0.25);
      else if (p < 0.55){ ang = lerp(-2.6, -0.35, (p-0.25)/0.3); slashing = true; }
      else ang = lerp(-0.35, -1.72, (p-0.55)/0.45);
      if (p < 0.55){ ox = -Math.round(Math.sin(p/0.55*Math.PI)*16); oy = -Math.round(Math.sin(p/0.55*Math.PI)*10); }
      if (p >= 0.45 && !GS.swing.hit){ GS.swing.hit = true; GS.swing.cb(); }
    }
  }
  if (GS.lostAt){ const k = Math.min(1, (now-GS.lostAt)/700); ang = lerp(-1.72, -0.8, k); oy = Math.round(k*34); }
  const tip = drawSword(c, Math.round(W*0.7) + ox, H + 4 + oy, ang, Math.round(H*0.5));
  if (slashing){ GS.trail.push(tip); if (GS.trail.length > 7) GS.trail.shift(); }
  GS.trail.forEach((pt, i) => { c.fillStyle = `rgba(255,255,255,${0.15 + i*0.1})`; c.fillRect(Math.round(pt.x)-1, Math.round(pt.y)-1, 3, 3); });
}
function gHP(){
  const a = $('#hp-you'), b = $('#hp-hag'); if (!a) return;
  a.style.width = (G.php/30*100) + '%'; b.style.width = (G.hhp/30*100) + '%';
  $('#hpt-you').textContent = G.php + '/30'; $('#hpt-hag').textContent = G.hhp + '/30';
}
function gLog(t){ G.log = t; const l = $('#glog'); if (l) l.textContent = t; }
function gUI(){
  const btn = $('#gbtn'); if (!btn) return;
  const st = {
    intro:['КТО ХОДИТ ПЕРВЫМ?', `${IC('d20',0,32)} Бросить к20`],
    init:['ИНИЦИАТИВА', `${IC('d20',0,32)} Перебросить к20`],
    player:['ТВОЙ ХОД', `${IC('weapon',0,24)} Бросить к12`],
    rolling:['ТВОЙ ХОД', 'Кубик катится…'],
    hag:['ХОД БАБКИ', 'Бабка колдует…'],
    end:['БОЙ ОКОНЧЕН', 'Ещё раз']
  }[G.phase] || ['',''];

function dmgNum(onHag, n){
  const fx = $('#gfx'); if (!fx) return;
  const el = document.createElement('div'); el.className = 'dmg ' + (onHag ? 'onhag' : 'onyou');
  el.textContent = '-' + n; el.style.left = onHag ? '50%' : '50%'; el.style.top = onHag ? '42%' : '78%';
  fx.appendChild(el); setTimeout(() => el.remove(), 1200);
}
function rollDice(specs, done){
  const row = $('#gdice'); if (!row) return;
  row.innerHTML = specs.map((s,i) => `<div class="die rolling" id="die${i}">${IC(s.sides===20?'d20':'d12',0,80)}<span class="dn">?</span><small>${s.label}</small></div>`).join('');
  const iv = setInterval(() => specs.forEach((s,i) => { const e = $('#die'+i+' .dn'); if (e) e.textContent = roll(s.sides); }), 70);
  hap('light');
  setTimeout(() => {
    clearInterval(iv);
    specs.forEach((s,i) => { const d = $('#die'+i); if (!d) return; d.classList.remove('rolling'); d.classList.add('landed'); d.querySelector('.dn').textContent = s.val; });
    hap('medium');
    setTimeout(done, 380);
  }, 850);
}
function gEndOverlay(){
  const e = $('#gend'); if (!e) return;
  const win = G.hhp <= 0;
  e.className = 'g-end ' + (win ? 'win' : 'lose');
  e.innerHTML = win
    ? `${IC('star','#f2c14e',40)}<h2>ПОЗДРАВЛЯЮ,<br>БАБКА ОТПИЗЖЕНА</h2><p>У тебя осталось ${G.php} HP</p>`
    : `${IC('x','#ff7a6a',40)}<h2>РВИ ЛИСТ<br>ПЕРСОНАЖА, ЧЕПУХ</h2><p>У бабки осталось ${G.hhp} HP</p>`;
}
function gEnd(){
  G.phase = 'end'; G.busy = false;
  if (GS){ if (G.hhp <= 0) GS.deadAt = performance.now(); else GS.lostAt = performance.now(); }
  setTimeout(() => { gEndOverlay(); hap(G.hhp <= 0 ? 'ok' : 'warn'); }, 700);
  gUI();
}
function hagTurn(){
  if (!$('#gbtn')) return;
  G.phase = 'hag'; G.busy = true; gUI(); gLog('Бабка бросает к12…');
  const dmg = roll(12);
  setTimeout(() => rollDice([{sides:12, label:'Бабка', val:dmg}], () => {
    if (!GS) return;
    GS.cast = {start:performance.now(), dur:900, cb:() => {
      G.php = Math.max(0, G.php - dmg); gHP(); dmgNum(false, dmg);
      const fl = $('#gflash'), st = $('#gstage');
      if (fl){ fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); }
      if (st){ st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); }
      hap('heavy');
      gLog(`Фиолетовый снаряд бьёт тебя: ${dmg} урона`);
      if (G.php <= 0) return gEnd();
      setTimeout(() => { G.phase = 'player'; G.busy = false; gUI(); }, 700);
    }};
  }), 500);
}
function gAct(){
  if (G.busy) return;
  if (G.phase === 'end'){ gReset(); render(); return; }
  if (G.phase === 'intro' || G.phase === 'init'){
    const sp = $('#gsplash'); if (sp) sp.classList.add('hide');
    G.busy = true; gUI();
    const a = roll(20), b = roll(20);
    rollDice([{sides:20, label:'Ты', val:a}, {sides:20, label:'Бабка', val:b}], () => {
      if (a === b){ G.phase = 'init'; G.busy = false; gLog('Ничья! Перебрасываем'); gUI(); return; }
      const dd = $('#die' + (a > b ? 0 : 1)); if (dd) dd.classList.add('best');
      gLog(a > b ? `Инициатива твоя: ${a} против ${b}` : `Бабка шустрее: ${b} против ${a}`);
      setTimeout(() => { if (a > b){ G.phase = 'player'; G.busy = false; gUI(); } else hagTurn(); }, 1000);
    });
    return;
  }
  if (G.phase === 'player'){
    G.phase = 'rolling'; G.busy = true; gUI();
    const dmg = roll(12);
    rollDice([{sides:12, label:'Урон', val:dmg}], () => {
      if (!GS) return;
      GS.swing = {start:performance.now(), dur:560, cb:() => {
        G.hhp = Math.max(0, G.hhp - dmg); gHP(); dmgNum(true, dmg); GS.hitUntil = performance.now() + 320; hap('heavy');
        gLog(`Ты рубишь мечом: ${dmg} урона`);
        if (G.hhp <= 0) return gEnd();
        setTimeout(hagTurn, 900);
      }};
    });
  }
}

function showNextLvl(){

  const el = document.createElement('div');
  el.className = 'lvlup'; el.id = 'lvlup';
  el.innerHTML = `<div class="rays"></div>${stars}
    <div class="inner">
      <div class="stage">${spr(q.id, 6)}<div class="lvl-badge"><span class="lvbox" style="display:inline-block;font-size:22px;min-width:60px"><small>УР</small>${q.to}</span></div></div>

      <h2>НОВЫЙ УРОВЕНЬ!</h2>

    S = d; save(); closeSheet(); stack = [{v:'home'}]; render(); toast('Летопись восстановлена');
  },
  wipe(){ S = {v:1, updatedAt:0, chars:{}}; save(); closeSheet(); stack = [{v:'home'}]; render(); toast('Все данные стёрты'); },
  lvlclose: () => closeLvl()
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  if (b.hasAttribute('data-confirm') && !b.classList.contains('armed')){
    b.classList.add('armed'); b._html = b.innerHTML; b.textContent = 'Точно?'; hap('warn');
    setTimeout(() => { if (b.isConnected && b.classList.contains('armed')){ b.classList.remove('armed'); b.innerHTML = b._html; } }, 3000);
    return;
  }
  if (b.dataset.a === 'openlink' && !tg) return;
  const fn = ACT[b.dataset.a]; if (fn){ e.preventDefault(); fn(b); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') back();
  if (e.key === 'Enter' && sheetOpen && e.target.tagName === 'INPUT'){ const btn = $('.sheet .pb:last-child'); if (btn){ e.preventDefault(); btn.click(); } }
});

/* background dither tile */
(() => { try {
  const cv = document.createElement('canvas'); cv.width = 8; cv.height = 8; const c = cv.getContext('2d');
  c.fillStyle = '#1b1324'; c.fillRect(0,0,8,8); c.fillStyle = '#211830'; c.fillRect(0,0,1,1); c.fillRect(4,4,1,1);
  document.body.style.backgroundImage = `url(${cv.toDataURL()})`;
} catch(e){} })();

/* ================= START ================= */
const local = lsGet();
if (local && local.chars) S = local;
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
if (CLOUD){
  cloudLoad(remote => {
    if (remote && remote.chars && (remote.updatedAt||0) > (S.updatedAt||0)){ S = remote; lsSet(JSON.stringify(S)); render(); }
    else if (!remote && S.updatedAt) cloudSave(JSON.stringify(S));
  });
}
})();
</script>
